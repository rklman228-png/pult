name: Cancel stale Rutube downloads
on:
  push:
    paths:
      - '.github/workflows/cancel-stale.yml'
permissions:
  contents: read
  actions: write
jobs:
  cancel-stale:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel outdated iOS builds stalled on old Rutube download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run cancel 44172141055 --repo "${{ github.repository }}" || true
          gh run cancel 44170473113 --repo "${{ github.repository }}" || true
