name: Rutube iOS IPA build
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Compile and embed Rutube UI Mod
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Reuse verified original Rutube 47.15 base from previous successful build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p source-ipa
          gh run download 44167893634 --repo "${{ github.repository }}" --name Rutube-iOS-IPA-unsigned --dir source-ipa
          cp source-ipa/Rutube.ipa original-rutube.ipa
          python3 - <<'PY'
          import zipfile,hashlib
          with zipfile.ZipFile("original-rutube.ipa") as z:
              assert z.testzip() is None
              b=z.read("Payload/Rutube.app/Rutube")
              assert len(b)>20_000_000
              assert b'@executable_path/Frameworks/RTUIFix.framework/RTUIFix' in b[:0x4000]
              print("Verified original app executable for module replacement, SHA256:",hashlib.sha256(b).hexdigest())
          PY

      - name: Compile native UI module (iPhone arm64)
        run: |
          xcodebuild -version
          bash scripts/compile_ios_framework.sh

      - name: Embed framework and set app name Rutube
        run: |
          python3 scripts/integrate.py \
            --base original-rutube.ipa \
            --framework build/RTUIFix.framework \
            --output Rutube.ipa

      - name: Verify output IPA
        run: |
          python3 - <<'PY'
          import zipfile,plistlib,struct
          p='Rutube.ipa'
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              names=z.namelist()
              app='Payload/Rutube.app/'
              assert app+'Frameworks/RTUIFix.framework/RTUIFix' in names
              props=plistlib.loads(z.read(app+'Info.plist'))
              assert props['CFBundleDisplayName']=='Rutube'
              assert props['CFBundleName']=='Rutube'
              binary=z.read(app+'Rutube')
              assert struct.unpack_from('<I',binary)[0]==0xfeedfacf
              assert b'@executable_path/Frameworks/RTUIFix.framework/RTUIFix' in binary[:0x4000]
              print('PASS: arm64 iOS IPA, app name Rutube, embedded UI framework')
              print('NOTE: unsigned, must sign app/framework/extensions to install')
          PY

      - name: Upload unsigned Rutube IPA
        uses: actions/upload-artifact@v4
        with:
          name: Rutube-iOS-IPA-unsigned
          path: Rutube.ipa
          if-no-files-found: error
          retention-days: 14
